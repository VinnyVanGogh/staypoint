name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

# PRs: a newer push to the same PR cancels the older run, so its runners free
# up at once (STA-777). main and tags: each commit gets its own group. A shared
# group would let a newer push replace an older run still waiting for a runner,
# and that commit would never be tested.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js-test:
    name: JS Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Guard – no copy-tests allowed
        run: |
          bad=$(grep -rl --include='*.mjs' 'Pure helpers mirroring app.js' tests/unit/ 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "ERROR: copy-test detected (contains 'Pure helpers mirroring app.js'):"
            echo "$bad"
            exit 1
          fi
          # Every test file must import from internal/server/webui/
          missing=$(grep -rL 'internal/server/webui/' tests/unit/*.mjs 2>/dev/null || true)
          if [ -n "$missing" ]; then
            echo "ERROR: test file(s) do not import from internal/server/webui/:"
            echo "$missing"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run JS unit tests
        run: node --test tests/unit/*.mjs

  # A PR's migration must not take a version main already ships under another
  # name (#247 used 40 while main had 40). Compares against main as fetched
  # now, not the base SHA the PR was opened against.
  migration-versions:
    name: Migration Versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Check migration versions against main
        run: go run ./cmd/migrationcheck -base origin/main

  playwright:
    name: Playwright UI Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright deps + browser
        run: |
          cd tests/ui
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Playwright UI specs
        run: scripts/ui-e2e.sh
        env:
          E2E_ARTIFACTS: tests/ui/artifacts

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: tests/ui/artifacts
          retention-days: 7

  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # PRs run Go 1.25 only, on both OSes: macOS stays because the daemon is
      # macOS-first (launchd, TCC). Pushes to main and tags run the full 2x2.
      # The full matrix on every PR used more runners than the free tier has,
      # and jobs were cancelled while queued (STA-777).
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        go-version: ${{ fromJSON(github.event_name == 'pull_request' && '["1.25"]' || '["1.24", "1.25"]') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Go Vet
        run: go vet ./...

      # Runs under a throwaway HOME and fails if a test leaves
      # ~/.staypoint/handoff* or ~/Desktop behind (STA-741).
      # -timeout 25m: internal/server takes ~2 min locally but, under -race,
      # brushed go test's 10m default on macos-latest and timed out mid-test
      # on #252, #254 and #255 (task-e53e4137). The job's own timeout still
      # bounds a real hang.
      - name: Run Tests (with race detector)
        run: scripts/check-test-home.sh -v -race -timeout 25m ./...

      # Short fuzz runs of the shared name normaliser and the safety checks
      # built on it (branch delete, org hold, prod detection). A failure
      # writes the input under testdata/fuzz; commit it as a regression seed.
      - name: Fuzz name matching
        if: matrix.os == 'ubuntu-latest'
        run: FUZZTIME=20s scripts/fuzz-names.sh

      # repoaccess builds for Windows, tests included (STA-697). The rest of the
      # module does not cross-build yet, so this is scoped to the package.
      - name: Vet repoaccess for Windows
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows go vet ./internal/repoaccess/...

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
        with:
          go-version-file: 'go.mod'
          go-package: ./...
        continue-on-error: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
        with:
          version: latest
        continue-on-error: true

      # Blocking, unlike golangci-lint above: a function no cmd/ binary can
      # reach, beyond the baseline, fails the build. Catches an exported gate
      # with no production caller, which `unused` cannot see (task-70e08aca).
      # macOS only: the baseline holds darwin-only files.
      - name: Dead code (deadcode vs baseline)
        if: matrix.os == 'macos-latest' && matrix.go-version == '1.25'
        run: scripts/check-deadcode.sh

      - name: Build Binaries (staypoint & staypointd)
        run: |
          go build -v -o bin/staypoint ./cmd/staypoint
          go build -v -o bin/staypointd ./cmd/staypointd

  release:
    name: Release Binaries
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
